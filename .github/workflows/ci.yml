name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify LiliaStudio
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify NanaUI native layout
        shell: pwsh
        run: |
          cmake -S native -B build/native-validation
          cmake --build build/native-validation --config Debug
          ctest --test-dir build/native-validation --output-on-failure -C Debug

      - name: Verify Rust workspace
        run: cargo test --workspace

      - name: Verify NanaUI host
        run: |
          cargo test --manifest-path native/Cargo.toml
          cargo check --manifest-path native/Cargo.toml --features nana-runtime
